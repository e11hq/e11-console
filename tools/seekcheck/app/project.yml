name: SeekCheck
options:
  bundleIdPrefix: ae.e11
targets:
  SeekCheck:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources, Resources]
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSupportsMultipleScenes: false
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
    settings:
      CODE_SIGNING_ALLOWED: NO
      SWIFT_VERSION: "5.0"
