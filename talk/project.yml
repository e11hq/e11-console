# E11 Talk — the chat app (project doc claude/client-groups-app-idea.md). Its own iPhone app, never part of E11
# Console's. Built, self-checked and signed on Haris's Mac by .github/workflows/talk.yml; sent to TestFlight only on
# Haris's yes (testflight.yml, as Console's builds).
name: E11Talk
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.10"   # (1.0.9 = build 266, approved on the App Store 2026-11-25 — approved/appstore-talk-1.0.9-build-266)
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  # Tells the server each message notification reached this phone — the sender's ✓✓ while Talk is closed (Notify/)
  E11TalkNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: Notify
      - path: Shared   # (the unread widget's store — Shared/WidgetStore.swift)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ae.e11.talk.ios.notify
        PRODUCT_NAME: E11TalkNotify
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Notify/E11TalkNotify.entitlements
        SKIP_INSTALL: YES
    entitlements:
      path: Notify/E11TalkNotify.entitlements
      properties:
        # (E11 Talk's own Keychain items: the server and its sign-in, which the app keeps there)
        keychain-access-groups: ["$(AppIdentifierPrefix)ae.e11.talk.ios"]
    info:
      path: Notify/Info.plist
      properties:
        CFBundleDisplayName: E11 Talk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSUserActivityTypes: [INSendMessageIntent]   # (iPhone's chat style for message notifications — Haris 2026-11-24)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  # The unread widget (home screen — Haris 2026-11-24): Widget/, reading only what the app and E11TalkNotify keep for it in
  # Talk's own Keychain (Shared/WidgetStore.swift); never the server
  E11TalkWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ae.e11.talk.ios.widget
        PRODUCT_NAME: E11TalkWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Widget/E11TalkWidget.entitlements
        SKIP_INSTALL: YES
    entitlements:
      path: Widget/E11TalkWidget.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)ae.e11.talk.ios"]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: E11 Talk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # (the App Store screenshots' UI test — never part of the app itself)
  E11TalkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: E11Talk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ae.e11.talk.ios.uitests
        TEST_TARGET_NAME: E11Talk
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  E11Talk:
    type: application
    platform: iOS
    dependencies:
      - target: E11TalkNotify
      - target: E11TalkWidget
    # (the scheme with the App Store screenshots' UI test — talk/UITests, talk.yml mode=shots)
    scheme:
      testTargets: [E11TalkUITests]
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ae.e11.talk.ios
        PRODUCT_NAME: E11Talk
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES   # (the occasion icons, OccasionIcon.swift — Haris 2026-11-19)
        CODE_SIGN_ENTITLEMENTS: App/E11Talk.entitlements
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: App/E11Talk.entitlements
      properties:
        aps-environment: development
        # (Communication Notifications: message notifications in iPhone's chat style — the group's picture with the small
        #  Talk icon, its name and the person — Haris 2026-11-24 21:28; Notify/NotificationService.swift)
        com.apple.developer.usernotifications.communication: true
        # (the chat backup: E11 Talk's own hidden folder in the person's iCloud Drive)
        com.apple.developer.icloud-container-identifiers: [iCloud.ae.e11.talk]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.ae.e11.talk]
        com.apple.developer.icloud-services: [CloudDocuments]
        # (the shared sign-in: E11 Console's key for this person, read from the group E11 Console already keeps it in —
        #  its own first group, ae.e11.console.shared (shared with its widget); Talk's own items stay in its own group, first)
        keychain-access-groups: ["$(AppIdentifierPrefix)ae.e11.talk.ios", "$(AppIdentifierPrefix)ae.e11.console.shared"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: E11 Talk
        CFBundleName: E11 Talk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSUserActivityTypes: [INSendMessageIntent]   # (iPhone's chat style for message notifications)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        ITSAppUsesNonExemptEncryption: false
        # (Ask the group — Haris 2026-11-20 21:36: a quiet notification wakes the app to send a file the group asked for)
        UIBackgroundModes: [remote-notification]
        # (the screen's full 120 frames a second on ProMotion for our own animations too — crossfades, the bubble lift, the
        #  reaction pill; without it iPhone holds an app's own animations to 60: the speed report, Haris 2026-11-14)
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: Take a photo or video to send in a group, or scan the code to link a Mac.
        NSPhotoLibraryUsageDescription: Show your recent photos in the + sheet, and pick photos and videos to send in a group.
        # (the + sheet — Haris 2026-11-16: send where you are, save a contact sent to you, open a place in your map app)
        NSLocationWhenInUseUsageDescription: Send your current location, or a place near you, in a group.
        NSContactsUsageDescription: Save a contact someone sent you to your contacts.
        LSApplicationQueriesSchemes: [comgooglemaps, waze]
        NSPhotoLibraryAddUsageDescription: Save photos and videos from your groups to Photos.
        NSMicrophoneUsageDescription: Record voice messages and the sound of videos you send.
        # (in the office, files go straight to and from the office server — Office.swift, Haris 2026-11-17)
        NSLocalNetworkUsageDescription: E11 Talk connects to the office server directly when you are in the office, so photos, videos and files move faster.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        TalkServerURL: https://talk.e11hq.com
        SharedKeychainGroup: $(AppIdentifierPrefix)ae.e11.console.shared
        NSFaceIDUsageDescription: Face ID signs you back in to E11 Talk.
        # (E11 Console's Talk button opens E11 Talk — Haris 2026-11-13)
        CFBundleURLTypes:
          - CFBundleURLName: ae.e11.talk
            CFBundleURLSchemes: [e11talk]
