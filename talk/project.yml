# E11 Talk — the chat app (project doc claude/client-groups-app-idea.md). Its own iPhone app, never part of E11
# Console's. Built, self-checked and signed on Haris's Mac by .github/workflows/talk.yml; sent to TestFlight only on
# Haris's yes (testflight.yml, as Console's builds).
name: E11Talk
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  # (the App Store screenshots' UI test — never part of the app itself)
  E11TalkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: E11Talk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ae.e11.talk.ios.uitests
        TEST_TARGET_NAME: E11Talk
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  E11Talk:
    type: application
    platform: iOS
    # (the scheme with the App Store screenshots' UI test — talk/UITests, talk.yml mode=shots)
    scheme:
      testTargets: [E11TalkUITests]
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ae.e11.talk.ios
        PRODUCT_NAME: E11Talk
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/E11Talk.entitlements
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: App/E11Talk.entitlements
      properties:
        aps-environment: development
        # (the chat backup: E11 Talk's own hidden folder in the person's iCloud Drive)
        com.apple.developer.icloud-container-identifiers: [iCloud.ae.e11.talk]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.ae.e11.talk]
        com.apple.developer.icloud-services: [CloudDocuments]
        # (the shared sign-in: E11 Console's key for this person, read from the group E11 Console already keeps it in —
        #  its own first group, ae.e11.console.shared (shared with its widget); Talk's own items stay in its own group, first)
        keychain-access-groups: ["$(AppIdentifierPrefix)ae.e11.talk.ios", "$(AppIdentifierPrefix)ae.e11.console.shared"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: E11 Talk
        CFBundleName: E11 Talk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        ITSAppUsesNonExemptEncryption: false
        # (the screen's full 120 frames a second on ProMotion for our own animations too — crossfades, the bubble lift, the
        #  reaction pill; without it iPhone holds an app's own animations to 60: the speed report, Haris 2026-11-14)
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: Take a photo or video to send in a group, or scan the code to link a Mac.
        NSPhotoLibraryUsageDescription: Pick photos and videos to send in a group.
        NSPhotoLibraryAddUsageDescription: Save photos and videos from your groups to Photos.
        NSMicrophoneUsageDescription: Record voice messages and the sound of videos you send.
        TalkServerURL: https://talk-test.e11hq.com
        SharedKeychainGroup: $(AppIdentifierPrefix)ae.e11.console.shared
        NSFaceIDUsageDescription: Face ID signs you back in to E11 Talk.
        # (E11 Console's Talk button opens E11 Talk — Haris 2026-11-13)
        CFBundleURLTypes:
          - CFBundleURLName: ae.e11.talk
            CFBundleURLSchemes: [e11talk]
