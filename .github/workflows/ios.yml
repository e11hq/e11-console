# The iPhone app (ios/): built on the Mac runner (Haris's own Mac), run in an iPhone simulator against a local server (self-test with
# screenshots). With the App Store Connect key in GitHub's secrets (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8,
# APPLE_TEAM_ID), main and manual runs also sign it and send it to TestFlight. ios-* branches try changes and put
# the self-test results on the release "ios-selftest" (for checking from Claude's workspace).
name: iPhone app
on:
  workflow_dispatch:
    inputs:
      send:
        description: "Send to TestFlight now (yes), or keep the signed build on the Mac until Haris says so (ask)"
        default: ask
      walk:
        description: "Run the walk-through for every role before signing (yes / no)"
        default: "yes"
      mac:
        description: "Which Mac builds it: own (Haris's Mac, the runner on it) or github (GitHub's Mac, when his is off)"
        default: own
      quick:
        description: "A quicker self-test (yes): Me, light / dark, sheets, the web comments, the slide-backs and the title readings left out (ios/selftest.py QUICK) — every other check still stops the build"
        default: "no"
      checks:
        description: "The simulator self-test: full (default), none, compile or shots (the App Store screenshots: nothing signed or sent) — compile only builds it for the simulator (nothing signed or sent: a check while working, Haris 2026-11-11 14:12); none signs and sends straight after the app builds, for quick TestFlight builds while working; the full self-test runs as the last step before a release (Haris 2026-11-11)"
        default: full
  # (no build on a push any more: every build only on Haris's word — Haris 2026-11-08; one build, straight to TestFlight)
permissions:
  contents: write
jobs:
  ios:
    # (Haris's own Mac, the GitHub runner on it — or GitHub's Mac when his is off: mac=github, Haris 2026-11-08)
    runs-on: ${{ inputs.mac == 'github' && fromJSON('["macos-26"]') || fromJSON('["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: The live server's code for the self-tests
        # (the phone talks to the server on main — the self-tests' local server runs main's server and shared rules, not this
        #  branch's older copy: the Office Admin's pages failed against ios-nav's old engine, build 1663 — Haris 2026-11-11)
        run: git fetch -q --depth=1 origin main && git checkout FETCH_HEAD -- server web && git log -1 --format='server and web from main %h %s' FETCH_HEAD
      - name: Homebrew's tools on this Mac
        run: for d in /opt/homebrew/bin /usr/local/bin; do [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"; done; true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Xcode project
        run: |
          brew install xcodegen >/dev/null
          cd ios && xcodegen generate
      - name: Build for the simulator
        run: |
          set +e
          xcodebuild -project ios/E11Console.xcodeproj -scheme E11Console -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/ios-build-full.log" | tail -40; status=${PIPESTATUS[0]}; grep -E "error:|warning: unre" "$RUNNER_TEMP/ios-build-full.log" | head -60 > "$RUNNER_TEMP/ios-build.log"; [ $status -eq 0 ] || exit $status
          test -d build/Build/Products/Debug-iphonesimulator/E11Console.app
          test -d build/Build/Products/Debug-iphonesimulator/E11Console.app/PlugIns/E11ConsoleWidget.appex && echo "widget: yes" || { echo "widget: MISSING"; exit 1; }
      - name: Self-test in the simulator
        # (its results are read from the release below; a failed check stops the build before signing: nothing goes to
        #  TestFlight — so no separate check build first, Haris 2026-11-08)
        id: selftest
        if: inputs.checks == 'full' || inputs.checks == ''
        continue-on-error: true
        env:
          E11_QUICK: ${{ inputs.quick }}
        run: python3 ios/selftest.py build/Build/Products/Debug-iphonesimulator/E11Console.app 2>&1 | tee "$RUNNER_TEMP/ios-selftest.log"; exit ${PIPESTATUS[0]}
      - name: The Apple pages without the website
        # (Haris 2026-11-10: the self-test above runs with the website behind the app, the phone without it — what failed on his
        #  phone passed here; these checks run the phone's way, and any one failing stops the build: nothing signed or sent)
        id: applecheck
        if: inputs.checks == 'full' || inputs.checks == ''
        continue-on-error: true
        timeout-minutes: 20
        run: python3 ios/walktest.py build/Build/Products/Debug-iphonesimulator/E11Console.app --apple 2>&1 | tee "$RUNNER_TEMP/ios-apple.log"; exit ${PIPESTATUS[0]}
      - name: App Store screenshots
        # (checks=shots — Haris 2026-11-11: the 6.9" simulator, dark, the App Review copy's demo data only; every step's
        #  screenshot kept in ios-appstore-shots.zip on the release below; nothing signed or sent)
        if: inputs.checks == 'shots'
        continue-on-error: true
        timeout-minutes: 60
        run: python3 ios/shots.py build/Build/Products/Debug-iphonesimulator/E11Console.app 2>&1 | tee "$RUNNER_TEMP/ios-shots.log"; true
      - name: Walk-through for every role, without the website
        # (ios/walktest.py — Haris 2026-11-05: every button, every role; read from the release below)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.walk != 'no'   # (ios-nav branch: no walk-through on branch pushes — quicker checks while the frame is built)
        continue-on-error: true
        timeout-minutes: 50
        run: python3 ios/walktest.py build/Build/Products/Debug-iphonesimulator/E11Console.app 2>&1 | tee "$RUNNER_TEMP/ios-walk.log"; true
      - name: Results for checking from Claude's workspace
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-selftest >/dev/null 2>&1 || gh release create ios-selftest --prerelease --title "iPhone app self-test" --notes "Latest iPhone app self-test results." --target "$GITHUB_SHA"
          for f in ios-splash.png ios-splashTicked.png ios-home.png ios-homeSwipe.png ios-homeLead.png ios-homePress.png ios-homeScrolled.png ios-homeFind.png ios-homeDate.png ios-mytasks.png ios-mytasksDone.png ios-mytasksScrolled.png ios-ibx.png ios-ibxSwipe.png ios-ibxUnread.png ios-daily.png ios-inbox.png ios-me.png ios-meProfile.png ios-meTrash.png ios-client.png ios-tpage.png ios-tpageScrolled.png ios-tpageSheet.png ios-tpageComments.png ios-tpageBack.png ios-task.png ios-sheet.png ios-back.png ios-nsheet.png ios-nsheetEnd.png ios-nsheetChannel.png ios-nsheetTitled.png ios-form.png ios-formTuck.png ios-cbar.png ios-cbarMention.png ios-cbarAttach.png ios-cfeed.png ios-cfeedKb.png ios-cfeedDown.png ios-cweb.png ios-cwebKb.png ios-cwebDown.png ios-preview.png ios-signin.png ios-done.png ios-build.log ios-selftest.log ios-server.log ios-crash.txt ios-run.mp4 ios-walk.json ios-walk.txt ios-walk.log ios-walk-shots.zip ios-apple.log ios-apple.txt ios-appstore-shots.zip ios-shots.log; do if [ -s "$RUNNER_TEMP/$f" ]; then gh release upload ios-selftest "$RUNNER_TEMP/$f" --clobber || echo "upload failed: $f"; fi; done; true
      - name: Self-test failed — nothing sent
        if: (inputs.checks == 'full' || inputs.checks == '') && (steps.selftest.outcome != 'success' || steps.applecheck.outcome != 'success')
        run: echo "The self-test failed (see ios-selftest.log / ios-apple.log on the release); nothing is signed or sent."; exit 1
      - name: Sign and send to TestFlight
        if: (github.ref_name == 'main' || github.event_name == 'workflow_dispatch') && inputs.checks != 'compile' && inputs.checks != 'shots' && (inputs.checks == 'none' || (steps.selftest.outcome == 'success' && steps.applecheck.outcome == 'success'))
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$APPLE_TEAM_ID" ]; then echo "No App Store Connect key yet: skipped"; exit 0; fi
          KEY="$RUNNER_TEMP/asc.p8"; printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          BUILD=$((1000 + GITHUB_RUN_NUMBER))
          xcodebuild -project ios/E11Console.xcodeproj -scheme E11Console -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/E11Console.xcarchive DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD" $AUTH archive 2>&1 | tee "$RUNNER_TEMP/ios-archive-full.log" | tail -40
          # (Haris 2026-11-03: every build waits for his yes before it goes to TestFlight — kept on this Mac, sent by
          #  the "Send to TestFlight" workflow with its build number)
          if [ "${{ github.event.inputs.send || 'ask' }}" != "yes" ]; then
            mkdir -p "$HOME/e11-archives"; rm -rf "$HOME/e11-archives/$BUILD"; mv build/E11Console.xcarchive "$HOME/e11-archives/$BUILD"
            ls -dt "$HOME"/e11-archives/*/ 2>/dev/null | tail -n +6 | xargs rm -rf 2>/dev/null; true
            rm -f "$KEY"; echo "Build $BUILD signed and kept — waiting for Haris before TestFlight"; exit 0
          fi
          sed "s/__TEAM__/$APPLE_TEAM_ID/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath build/E11Console.xcarchive -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/export $AUTH 2>&1 | tee "$RUNNER_TEMP/ios-export-full.log" | tail -40
          rm -f "$KEY"
          echo "Build $BUILD sent to TestFlight"
      - name: TestFlight logs for checking from Claude's workspace
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (errors and the last lines only: no keys or tokens are ever printed by xcodebuild)
          for f in archive export; do if [ -s "$RUNNER_TEMP/ios-$f-full.log" ]; then { grep -E "error|Error|ERROR|failed|Failed" "$RUNNER_TEMP/ios-$f-full.log" | head -60; echo ---; tail -60 "$RUNNER_TEMP/ios-$f-full.log"; } > "$RUNNER_TEMP/ios-$f.log"; gh release upload ios-selftest "$RUNNER_TEMP/ios-$f.log" --clobber || true; fi; done; true
