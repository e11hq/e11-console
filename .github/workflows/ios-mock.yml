# Throwaway mockups (branch ios-mock only): tools/ios-mock built and photographed in the iPhone simulator on Haris's Mac.
name: iPhone mockups
on:
  push:
    branches: ['mock-iphone']
permissions:
  contents: write
jobs:
  mock:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Homebrew's tools on this Mac
        run: for d in /opt/homebrew/bin /usr/local/bin; do [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"; done; true
      - name: Build and photograph
        run: |
          set +e
          command -v xcodegen >/dev/null || brew install xcodegen >/dev/null
          cd tools/ios-mock && xcodegen generate && cd ../..
          xcodebuild -project tools/ios-mock/Mock.xcodeproj -scheme Mock -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build-mock CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/mock-build.log" | tail -15
          APP=build-mock/Build/Products/Debug-iphonesimulator/Mock.app
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin)['devices']
          v=lambda rt:[int(x) for x in re.findall(r'(\\d+)', rt.split('iOS')[-1])[:2]]
          p=[(v(k),x) for k,xs in d.items() if 'iOS' in k for x in xs if re.match(r'iPhone \\d', x['name']) and 'Pro Max' not in x['name']]
          p.sort(key=lambda t:(t[0],t[1]['name'])); print(p[-1][1]['udid'])")
          echo "device $DEV"
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b >/dev/null
          xcrun simctl status_bar "$DEV" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 2>/dev/null
          xcrun simctl install "$DEV" "$APP"; echo "install $?"
          mkdir -p "$RUNNER_TEMP/shots"
          for look in light dark; do
            xcrun simctl ui "$DEV" appearance $look
            for s in 1; do
              xcrun simctl terminate "$DEV" ae.e11.mock 2>/dev/null
              xcrun simctl launch "$DEV" ae.e11.mock -scene $s; echo "launch $s $look $?"; sleep 6
              xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/shots/mock-$s-$look.png"
            done
          done
          xcrun simctl terminate "$DEV" ae.e11.mock; xcrun simctl shutdown "$DEV"; true
      - name: Results for checking from Claude's workspace
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-mock >/dev/null 2>&1 || gh release create ios-mock --prerelease --title "iPhone mockups" --notes "Throwaway mockup screenshots." --target "$GITHUB_SHA"
          grep -E "error:" "$RUNNER_TEMP/mock-build.log" | sort -u | head -40 > "$RUNNER_TEMP/mock-errors.log"
          [ -s "$RUNNER_TEMP/mock-errors.log" ] && gh release upload ios-mock "$RUNNER_TEMP/mock-errors.log" --clobber
          for f in "$RUNNER_TEMP"/shots/*.png; do [ -s "$f" ] && gh release upload ios-mock "$f" --clobber; done; true
