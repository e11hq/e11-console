# The NAS container image (runtime + launcher). Rebuilt only when the launcher or Dockerfile change.
name: Image
on:
  push:
    branches: [main]
    paths: ['launcher/**', 'Dockerfile', '.github/workflows/image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/e11hq/e11-console:latest
            ghcr.io/e11hq/e11-console:${{ github.sha }}
