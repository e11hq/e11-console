name: Symbols mockup (one-off)
on:
  push:
    branches: [symbols-mockup]
permissions:
  contents: write
jobs:
  draw:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - run: swift tools/mock/symbols.swift "$RUNNER_TEMP/symbols-mockup.png"
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload ios-selftest "$RUNNER_TEMP/symbols-mockup.png" --clobber
