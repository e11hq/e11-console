name: Test
on:
  pull_request:
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools used for previews
        # GitHub's Ubuntu package mirror is sometimes slow or down: try it briefly, and if it fails
        # fetch ffmpeg another way (npm) so a mirror problem never blocks a release
        timeout-minutes: 6
        continue-on-error: true
        run: |
          APT="-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          timeout 120 sudo apt-get $APT update && timeout 150 sudo apt-get $APT install -y --no-install-recommends ffmpeg poppler-utils python3-pil
      - name: ffmpeg fallback
        timeout-minutes: 4
        run: |
          if command -v ffmpeg >/dev/null; then ffmpeg -version | head -1; exit 0; fi
          npm install -g ffmpeg-static@5.2.0
          sudo ln -sf "$(npm root -g)/ffmpeg-static/ffmpeg" /usr/local/bin/ffmpeg
          ffmpeg -version | head -1
      - name: Server tests
        working-directory: server
        run: |
          set +e
          npm test 2>&1 | tee "$RUNNER_TEMP/server-tests.log"
          status=${PIPESTATUS[0]}
          [ $status -eq 0 ] || echo "$status" > "$RUNNER_TEMP/server-tests.failed"
          exit $status
      # (Claude's workspace can't read Actions logs: a failed run's test output goes on the release "ci-logs")
      - name: Failed test output for checking from Claude's workspace
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/server-tests.failed" ] || exit 0
          grep -nE "^not ok|# Subtest|AssertionError|Error|expected|actual|at .*test\.js" "$RUNNER_TEMP/server-tests.log" | head -300 > "$RUNNER_TEMP/server-tests-failed.log"
          gh release view ci-logs -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create ci-logs -R "$GITHUB_REPOSITORY" --prerelease --title "CI logs" --notes "Failed test output." --target "$GITHUB_SHA"
          gh release upload ci-logs -R "$GITHUB_REPOSITORY" "$RUNNER_TEMP/server-tests-failed.log" "$RUNNER_TEMP/server-tests.log" --clobber; true
      - name: Updater tests
        working-directory: launcher
        run: npm test
