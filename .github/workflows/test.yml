name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools used for previews
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils python3-pil
      - name: Server tests
        working-directory: server
        run: npm test
