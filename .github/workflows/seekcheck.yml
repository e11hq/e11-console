# The seek bar's let-go, measured on the Mac (tools/seekcheck/seek.swift) — nothing of the apps built or changed. (Haris 2026-11-23)
name: Seek bar check
on:
  workflow_dispatch:
    inputs:
      video:
        description: "A video from a release asset name on ios-selftest (empty: test videos made here)"
        default: ""
permissions:
  contents: write
jobs:
  seek:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Homebrew's tools
        run: for d in /opt/homebrew/bin /usr/local/bin; do [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"; done; true
      - name: Test videos (iPhone-like — HEVC and H.264 with B-frames, 1080 × 1920, 30 fps, 3 s)
        run: |
          cd "$RUNNER_TEMP"
          ffmpeg -v error -y -f lavfi -i testsrc2=s=1080x1920:r=30:d=3 -c:v libx265 -tag:v hvc1 -pix_fmt yuv420p hevc.mp4 || true
          ffmpeg -v error -y -f lavfi -i testsrc2=s=1080x1920:r=30:d=3 -c:v libx264 -profile:v high -bf 2 -pix_fmt yuv420p h264.mp4
          ls -la *.mp4
      - name: Measure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"; out=seekcheck.txt; : > $out
          for v in hevc.mp4 h264.mp4; do [ -f $v ] || continue
            for way in as final chase cancel; do for to in 0 1.0; do
              echo "===== $v · $way · to $to" | tee -a $out
              swift "$GITHUB_WORKSPACE/tools/seekcheck/seek.swift" "$RUNNER_TEMP/$v" $way $to 2>&1 | tee -a $out
            done; done
          done
          gh release view ios-selftest >/dev/null 2>&1 && gh release upload ios-selftest $out --clobber
