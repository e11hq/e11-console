# E11 Talk on Cloudflare (relay/): check the Cloudflare token, or publish the Worker.
# Secrets added by Haris 2026-11-21: CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers", e11hq.com), CLOUDFLARE_ACCOUNT_ID.
name: Talk relay
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = the token works, nothing published · deploy = publish relay/ · watch = Cloudflare's live log for 5 minutes (each request: path, status, time taken — nothing else)"
        default: check
        type: choice
        options: [check, deploy, watch, r2check]
concurrency:
  group: talk-relay
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # (Talk's R2 key — uploads straight to R2's own addresses, as up to 2026-11-21; added by Haris as repo secrets)
      TALK_R2_KEY_ID: ${{ secrets.TALK_R2_KEY_ID }}
      TALK_R2_SECRET: ${{ secrets.TALK_R2_SECRET }}
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Both secrets there
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "CLOUDFLARE_API_TOKEN missing"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "CLOUDFLARE_ACCOUNT_ID missing"; exit 1; }
          echo "Both secrets present"
      # (Haris 2026-11-22 21:25: where the wait after an upload goes — Cloudflare's own time for each of Talk's requests, while
      #  he sends a few files. Only the path (file addresses cut short), the status and the times are printed: no headers,
      #  no sign-ins, no contents)
      - name: Cloudflare's live log, 5 minutes
        if: inputs.mode == 'watch'
        run: |
          (timeout 300 npx --yes wrangler@4 tail --format json || true) > tail.json
          jq -r 'select(.event != null) | [ (.eventTimestamp/1000 | strftime("%H:%M:%S")), ((.eventTimestamp % 1000)|tostring), (.event.request.method // "-"), ((.event.request.url // .event.type // "-") | sub("^https?://[^/]+"; "") | sub("/r2/(?<k>put|get)/.*"; "/r2/\(.k)/…") | sub("\\?.*"; "")), ((.event.response.status // "-")|tostring), ("wall " + ((.wallTime // 0)|tostring) + "ms"), ("cpu " + ((.cpuTime // 0)|tostring) + "ms"), (.outcome // "-")] | @tsv' tail.json || echo "The log couldn't be read ($(wc -c < tail.json) bytes)"
          echo "--- statements that read over 500 rows ([rows] count statement):"
          jq -r 'select(.logs != null) | .logs[] | (.message | map(tostring) | join(" ")) | select(startswith("[rows]") or startswith("[req]"))' tail.json | sort | uniq -c | sort -k3,3nr | head -80 || true
          echo "--- log lines in all: $(jq -r 'select(.logs != null) | .logs[]' tail.json | jq -s length 2>/dev/null)"
      # (Haris 2026-11-22 22:11: uploads straight to R2 failed — the key tried with the office's own signing: a tiny file put,
      #  read, deleted; only R2's status and error code are printed, never the key)
      - name: R2 key check
        if: inputs.mode == 'r2check'
        working-directory: server
        run: |
          echo "key id length: ${#TALK_R2_KEY_ID} (an R2 Access Key ID is 32), secret length: ${#TALK_R2_SECRET} (an R2 Secret Access Key is 64)"
          node --input-type=module -e "
          import { createR2 } from './src/r2.js';
          const r2 = createR2({ account: process.env.CLOUDFLARE_ACCOUNT_ID, keyId: process.env.TALK_R2_KEY_ID, secret: process.env.TALK_R2_SECRET, bucket: 'e11-talk-files' });
          const key = 'msg/zz-keycheck-' + Date.now();
          const s = await r2.start(key, 10);
          const put = await fetch(s.put, { method: 'PUT', body: 'keycheck!!' });
          const pt = await put.text();
          console.log('PUT', put.status, (pt.match(/<Code>([^<]+)/) || [])[1] || '', (pt.match(/<Message>([^<]+)/) || [])[1] || '');
          console.log('size', await r2.size(key));
          console.log('delete', await r2.del(key));
          "
      - name: Tests (E11 Talk's own code over the hub's database)
        if: inputs.mode != 'watch' && inputs.mode != 'r2check'
        run: node --import ./test/register.mjs --test test/*.test.mjs
      - name: The token works (who it is, which account)
        if: inputs.mode != 'watch' && inputs.mode != 'r2check'
        run: npx --yes wrangler@4 whoami
      - name: R2 buckets on the account (names only)
        if: inputs.mode != 'watch' && inputs.mode != 'r2check'
        run: npx --yes wrangler@4 r2 bucket list
      - name: The Worker builds (nothing published)
        if: inputs.mode != 'watch' && inputs.mode != 'r2check'
        run: npx --yes wrangler@4 deploy --dry-run --outdir dist
      - name: Publish
        if: inputs.mode == 'deploy'
        run: npx --yes wrangler@4 deploy
      # (the key the relay signs its file addresses with: made here once, at random — nobody types or sees it)
      - name: The file-address key, once
        if: inputs.mode == 'deploy'
        run: |
          if ! npx --yes wrangler@4 secret list 2>/dev/null | grep -q R2_LINK_SECRET; then
            openssl rand -hex 32 | npx --yes wrangler@4 secret put R2_LINK_SECRET
          fi
      # (the R2 key for uploads straight to R2, when it's in the repo's secrets: put into the Worker's secrets — nobody sees it)
      - name: Talk's R2 key, when it's there
        if: inputs.mode == 'deploy'
        run: |
          if [ -n "$TALK_R2_KEY_ID" ] && [ -n "$TALK_R2_SECRET" ]; then
            printf '%s' "$TALK_R2_KEY_ID" | npx --yes wrangler@4 secret put R2_ACCESS_KEY_ID
            printf '%s' "$TALK_R2_SECRET" | npx --yes wrangler@4 secret put R2_SECRET_ACCESS_KEY
            echo "R2 key put into the Worker"
          else echo "No R2 key in the repo's secrets yet — uploads go through the relay as before"; fi
