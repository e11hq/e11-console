# E11 Talk on Cloudflare (relay/): check the Cloudflare token, or publish the Worker.
# Secrets added by Haris 2026-11-21: CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers", e11hq.com), CLOUDFLARE_ACCOUNT_ID.
name: Talk relay
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = the token works, nothing published · deploy = publish relay/"
        default: check
        type: choice
        options: [check, deploy]
concurrency:
  group: talk-relay
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Both secrets there
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "CLOUDFLARE_API_TOKEN missing"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "CLOUDFLARE_ACCOUNT_ID missing"; exit 1; }
          echo "Both secrets present"
      - name: The token works (who it is, which account)
        run: npx --yes wrangler@4 whoami
      - name: The Worker builds (nothing published)
        run: npx --yes wrangler@4 deploy --dry-run --outdir dist
      - name: Publish
        if: inputs.mode == 'deploy'
        run: npx --yes wrangler@4 deploy
