# Every change on main is tested, then:
#  • published as the "staging" release → test.e11hq.com installs it within minutes
#  • if VERSION was raised and release-notes/<VERSION>.md exists → also published as a real
#    release v<VERSION> → console.e11hq.com installs it at 2 AM (or when an Admin clicks Update now)
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/test.yml
  # the Swift Mac app is built again only when mac/ changed (or no build is stored yet)
  changes:
    runs-on: ubuntu-latest
    outputs:
      mac: ${{ steps.c.outputs.mac }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: c
        run: |
          BEFORE="${{ github.event.before }}"
          if ! gh release view mac-app >/dev/null 2>&1 || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then echo "mac=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(mac/|\.github/workflows/mac\.yml)'; then echo "mac=yes" >> "$GITHUB_OUTPUT"; else echo "mac=no" >> "$GITHUB_OUTPUT"; fi
  mac:
    needs: changes
    if: needs.changes.outputs.mac == 'yes'
    uses: ./.github/workflows/mac.yml
  publish:
    needs: [test, changes, mac]
    if: ${{ always() && needs.test.result == 'success' && needs.changes.result == 'success' && (needs.mac.result == 'success' || needs.mac.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mac app build (new)
        if: needs.mac.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: mac-app
          path: mac/bin
      - name: Mac app build (stored)
        run: |
          mkdir -p mac/bin
          if [ -f mac/bin/E11Console.zip ]; then
            gh release view mac-app >/dev/null 2>&1 || gh release create mac-app --prerelease --title "Mac app build" --notes "The Swift Mac app's program, used by the installer. Updated when mac/ changes." --target "$GITHUB_SHA"
            gh release upload mac-app mac/bin/E11Console.zip --clobber
          else
            gh release download mac-app -p E11Console.zip -D mac/bin || echo "no stored Mac build: the installer uses the earlier app"
          fi
          # the Mac app version inside the build (the server asks older Mac apps to update to this one, never past it)
          if [ -f mac/bin/E11Console.zip ]; then unzip -p mac/bin/E11Console.zip SHELL_VERSION > mac/bin/SHELL_VERSION 2>/dev/null || rm -f mac/bin/SHELL_VERSION; fi
          ls -l mac/bin || true
      - name: Work out versions
        id: v
        run: |
          VERSION="$(cat VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -f "release-notes/$VERSION.md" ] && ! gh release view "v$VERSION" >/dev/null 2>&1; then echo "stable=yes" >> "$GITHUB_OUTPUT"; else echo "stable=no" >> "$GITHUB_OUTPUT"; fi
          LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          { echo "## Changes on the test copy"; git log --no-merges --format='- %s' ${LAST:+$LAST..}HEAD | head -40; } > staging-notes.md
      - name: Publish real release
        if: steps.v.outputs.stable == 'yes'
        run: |
          scripts/bundle.sh "${{ steps.v.outputs.version }}" "release-notes/${{ steps.v.outputs.version }}.md"
          gh release create "v${{ steps.v.outputs.version }}" dist/e11-console-${{ steps.v.outputs.version }}.tar.gz \
            --target "$GITHUB_SHA" --title "E11 Console ${{ steps.v.outputs.version }}" --notes-file "release-notes/${{ steps.v.outputs.version }}.md"
      - name: Publish test release
        run: |
          TV="${{ steps.v.outputs.version }}-test.${GITHUB_RUN_NUMBER}"
          scripts/bundle.sh "$TV" staging-notes.md
          gh release delete staging --yes --cleanup-tag || true
          gh release create staging "dist/e11-console-$TV.tar.gz" --prerelease --target "$GITHUB_SHA" \
            --title "Test copy $TV" --notes-file staging-notes.md
