# Talk's chat bubble — its words and its time — laid out in the iPhone simulator as Talk lays it (tools/bubblecheck):
# measuring only, nothing of the apps built or changed (Haris 2026-11-25 20:57)
name: Bubble check
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  bubbles:
    runs-on: [self-hosted, macOS, ARM64]   # (Haris's Mac — never GitHub's unless he says: 2026-11-25 21:14)
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Laid out and measured in the simulator
        run: |
          brew install xcodegen >/dev/null 2>&1 || true
          cd tools/bubblecheck && xcodegen generate >/dev/null
          xcodebuild -project BubbleCheck.xcodeproj -scheme BubbleCheck -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/bc" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/b.log" 2>&1 || true
          grep -E "error:" "$RUNNER_TEMP/b.log" | sort -u | head -20; tail -2 "$RUNNER_TEMP/b.log"
          APP=$(ls -d "$RUNNER_TEMP"/bc/Build/Products/Debug-iphonesimulator/BubbleCheck.app)
          xcrun simctl list devices available | grep -E "iPhone 1[5-7]( Pro)? \(" | head -5
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys,re; d=json.load(sys.stdin)['devices']; a=[x for k,v in d.items() if 'iOS' in k for x in v]; p=[x for x in a if re.fullmatch(r'iPhone 1[5-7]', x['name'])] or [x for x in a if re.match(r'iPhone \\d', x['name']) and 'Max' not in x['name']]; print(p[-1]['udid'])")
          xcrun simctl boot $UDID || true; xcrun simctl bootstatus $UDID -b
          xcrun simctl install $UDID "$APP"; xcrun simctl launch $UDID ae.e11.BubbleCheck
          D=$(xcrun simctl get_app_container $UDID ae.e11.BubbleCheck data)/Documents
          for i in $(seq 1 60); do [ -f "$D/done.txt" ] && break; sleep 1; done; sleep 2
          xcrun simctl io $UDID screenshot "$RUNNER_TEMP/bubbles.png"
          cat "$D/bubbles.txt" > "$RUNNER_TEMP/bubbles.txt" || echo none > "$RUNNER_TEMP/bubbles.txt"
          grep -c OVERLAP "$RUNNER_TEMP/bubbles.txt" || true
          grep -E "8:4[01] PM|8:5[23] PM|OVERLAP" "$RUNNER_TEMP/bubbles.txt" | head -60
      - name: The picture and the numbers kept (branch seekcheck-data)
        run: |
          cd "$RUNNER_TEMP" && git clone -q --depth 1 -b seekcheck-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" d || (git init -q d && cd d && git checkout -q -b seekcheck-data)
          cd "$RUNNER_TEMP/d" && cp "$RUNNER_TEMP/bubbles.png" "$RUNNER_TEMP/bubbles.txt" . && git add bubbles.png bubbles.txt
          git -c user.name=bubblecheck -c user.email=bubblecheck@e11.invalid commit -qm "bubble check $(date -u +%FT%TZ)" && git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:seekcheck-data
