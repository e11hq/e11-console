# The Swift Mac app: built for Intel and Apple silicon on GitHub's Mac, installed with the real installer and
# checked in self-test mode. Called by Release only when mac/ changed (Mac minutes count 10× toward the free
# allowance); mac-* branches run it on their own for trying changes.
name: Mac app
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ['mac-*']
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: bash mac/swift/build.sh
      - name: Install and self-test
        run: python3 mac/swift/selftest.py 2>&1 | tee "$RUNNER_TEMP/selftest.log"; exit ${PIPESTATUS[0]}
      - name: Pictures and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-selftest
          path: |
            ${{ runner.temp }}/selftest.json
            ${{ runner.temp }}/selftest.png
            ${{ runner.temp }}/server.log
          if-no-files-found: ignore
      - name: Results for checking from Claude's workspace (mac-* branches only)
        if: always() && startsWith(github.ref_name, 'mac-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mac-selftest >/dev/null 2>&1 || gh release create mac-selftest --prerelease --title "Mac app self-test (work branch)" --notes "Latest self-test results from a mac-* branch." --target "$GITHUB_SHA"
          cp mac/selftest.log "$RUNNER_TEMP/" 2>/dev/null || true
          for f in selftest.json selftest.png server.log selftest.log icon-light.png icon-dark.png; do [ -f "$RUNNER_TEMP/$f" ] && gh release upload mac-selftest "$RUNNER_TEMP/$f" --clobber; done; true
      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: mac/bin/E11Console.zip
