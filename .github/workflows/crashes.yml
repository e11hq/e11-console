# TestFlight crash reports for checking from Claude's workspace: the latest crashes testers sent with "Share" in
# TestFlight (their note, the build, the device and the crash log), read with the App Store Connect key in GitHub's
# secrets (never printed) and put on the ios-selftest release as ios-crashes.txt. Run by hand.
name: TestFlight crashes
on:
  workflow_dispatch:
    inputs:
      count:
        description: How many of the latest crash reports
        default: "3"
permissions:
  contents: write
jobs:
  crashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the latest crash reports
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          COUNT: ${{ inputs.count }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q pyjwt cryptography requests
          python3 - <<'PY'
          import os, time, json, jwt, requests
          key = os.environ['ASC_KEY_P8']
          tok = jwt.encode({'iss': os.environ['ASC_ISSUER_ID'], 'iat': int(time.time()), 'exp': int(time.time()) + 900, 'aud': 'appstoreconnect-v1'}, key, algorithm='ES256', headers={'kid': os.environ['ASC_KEY_ID'], 'typ': 'JWT'})
          H = {'Authorization': 'Bearer ' + tok}
          API = 'https://api.appstoreconnect.apple.com'
          out = []
          def get(path, **params):
              r = requests.get(API + path, headers=H, params=params, timeout=60)
              if r.status_code != 200: out.append(f'{path}: HTTP {r.status_code} {r.text[:300]}'); return None
              return r.json()
          app = get('/v1/apps', **{'filter[bundleId]': 'ae.e11.console.ios'})
          if app and app.get('data'):
              aid = app['data'][0]['id']
              subs = get(f'/v1/apps/{aid}/betaFeedbackCrashSubmissions', sort='-createdDate', limit=os.environ.get('COUNT') or '3')
              for s in (subs or {}).get('data', []):
                  a = s.get('attributes', {})
                  out.append('=' * 80)
                  out.append(json.dumps({k: a.get(k) for k in ('createdDate', 'comment', 'deviceModel', 'osVersion', 'buildBundleId', 'appUptimeInMilliseconds', 'connectionType')}, indent=1))
                  log = get(f"/v1/betaFeedbackCrashSubmissions/{s['id']}/crashLog")
                  if log and log.get('data'): out.append((log['data'].get('attributes') or {}).get('logText') or '(no log text)')
          else: out.append('app not found')
          open('ios-crashes.txt', 'w').write('\n'.join(out))
          print('\n'.join(l for l in out if not l.startswith(' ') )[:3000])
          PY
          gh release upload ios-selftest ios-crashes.txt --clobber
