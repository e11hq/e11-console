# The E11 Console iPhone app. GitHub's Mac turns this into an Xcode project (xcodegen), builds it, runs it in an
# iPhone simulator (self-test with screenshots) and, with the App Store Connect key in GitHub's secrets, signs it
# and sends it to TestFlight. See .github/workflows/ios.yml.
name: E11Console
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.5"   # (1.2.4 = build 1900, in App Store review 2026-11-19 — 1.2.5: the app's own sign-in screen.) (1.2.3 approved by Apple — found 2026-11-19 when TestFlight refused a new 1.2.3 build; 1.2.4: taps during a back slide or a closing sheet. Before: 1.2.2 approved by Apple — found 2026-11-18 when TestFlight refused a new 1.2.2 build; 1.2.3: the sign-in fixes, office network, Me › Server)
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  E11Console:
    type: application
    platform: iOS
    # (the scheme with the crawl — Apple's UI testing tapping every control, ios/UITests, .github/workflows/ios-crawl.yml)
    scheme:
      testTargets: [E11ConsoleUITests]
    sources:
      - path: App
      - path: ../widget/WidgetShare.swift
    dependencies:
      - target: E11ConsoleWidget
      - target: E11ConsoleNotify
      - target: E11ConsoleNotifyUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ae.e11.console.ios
        PRODUCT_NAME: E11Console
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES   # (the occasion icons, OccasionIcon.swift — Haris 2026-11-19)
        CODE_SIGN_ENTITLEMENTS: App/E11Console.entitlements
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: App/E11Console.entitlements
      properties:
        aps-environment: development
        keychain-access-groups: [$(AppIdentifierPrefix)ae.e11.console.shared]   # (shared with the widget: WidgetShare)
        com.apple.developer.associated-domains: [applinks:files.e11hq.com, applinks:files-test.e11hq.com]   # (file links open in the app — flinks.js)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: E11 Console
        # (a quiet note from the server when something is read elsewhere: its notifications off this iPhone — Haris 2026-11-16)
        UIBackgroundModes: [remote-notification]
        # (the Talk button: is E11 Talk on this iPhone — Haris 2026-11-13)
        LSApplicationQueriesSchemes: [e11talk, comgooglemaps, waze]   # (+ a place opening in this iPhone's map apps — Haris 2026-11-16)
        CFBundleName: E11 Console
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIViewControllerBasedStatusBarAppearance: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        ITSAppUsesNonExemptEncryption: false
        # (the screen's full 120 frames a second on ProMotion for our own animations too — crossfades, fades, the squash and
        #  stretch, the preview's flight; without it iPhone holds an app's own animations to 60 — as E11 Talk, Haris 2026-11-16)
        CADisableMinimumFrameDurationOnPhone: true
        NSFaceIDUsageDescription: Lock E11 Console with Face ID, if you turn it on in Me.
        NSCameraUsageDescription: Take a photo or video to attach to a task.
        NSMicrophoneUsageDescription: Record voice messages for comments, and sound with a video you attach to a task.
        NSPhotoLibraryAddUsageDescription: Save pictures and videos you download from E11 Console to Photos.
        # (the + sheet — Haris 2026-11-16: your recent photos in it, send where you are in a comment, save a contact sent there)
        NSPhotoLibraryUsageDescription: Show your recent photos in the + sheet, to attach to a task, a comment or Client Assets.
        NSLocationWhenInUseUsageDescription: Send your current location, or a place near you, in a comment.
        NSContactsUsageDescription: Save a contact someone sent in a comment to your contacts.
        # (in the office, files go straight to and from the office server — Office.swift, Haris 2026-11-17: the Mac app's words)
        NSLocalNetworkUsageDescription: E11 Console connects to the office server directly when you are in the office, so big files move faster.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        E11ServerURL: https://console.e11hq.com
        E11TestServerURL: https://test.e11hq.com
        E11ReviewServerURL: https://review.e11hq.com
        E11KeychainGroup: $(AppIdentifierPrefix)ae.e11.console.shared
        CFBundleURLTypes:
          - CFBundleURLName: ae.e11.console.link
            CFBundleURLSchemes: [e11console]
  # The widget (home and lock screen): widget/E11Widget.swift, the same one the Mac App Store app has
  E11ConsoleWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ae.e11.console.ios.widget
        PRODUCT_NAME: E11ConsoleWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Widget/E11ConsoleWidget.entitlements
        SKIP_INSTALL: YES
    entitlements:
      path: Widget/E11ConsoleWidget.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)ae.e11.console.shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: E11 Console
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        E11KeychainGroup: $(AppIdentifierPrefix)ae.e11.console.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # Confirms each notification to the server, so ones an offline phone missed are sent again (notify/)
  E11ConsoleNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: ../notify
      - path: ../widget/WidgetShare.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ae.e11.console.ios.notify
        PRODUCT_NAME: E11ConsoleNotify
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Notify/E11ConsoleNotify.entitlements
        SKIP_INSTALL: YES
    entitlements:
      path: Notify/E11ConsoleNotify.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)ae.e11.console.shared]
    info:
      path: Notify/Info.plist
      properties:
        CFBundleDisplayName: E11 Console
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        E11KeychainGroup: $(AppIdentifierPrefix)ae.e11.console.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  # A notification held: Apple's expanded view with the app's preview of it, as the Inbox's peek (notifyui/ — Haris 2026-11-10)
  E11ConsoleNotifyUI:
    type: app-extension
    platform: iOS
    sources:
      - path: ../notifyui
      - path: ../widget/WidgetShare.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ae.e11.console.ios.notifyui
        PRODUCT_NAME: E11ConsoleNotifyUI
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: NotifyUI/E11ConsoleNotifyUI.entitlements
        SKIP_INSTALL: YES
    entitlements:
      path: NotifyUI/E11ConsoleNotifyUI.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)ae.e11.console.shared]
    info:
      path: NotifyUI/Info.plist
      properties:
        CFBundleDisplayName: E11 Console
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        E11KeychainGroup: $(AppIdentifierPrefix)ae.e11.console.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: [e11.comment, e11.task]
            UNNotificationExtensionInitialContentSizeRatio: 0.5
            UNNotificationExtensionDefaultContentHidden: true
  # The crawl (Haris 2026-11-05: "every single thing"): Apple's UI testing taps every control on every screen, as each role
  E11ConsoleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: E11Console
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ae.e11.console.ios.uitests
        TEST_TARGET_NAME: E11Console
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
