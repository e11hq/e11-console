# The E11 Console iPhone app. GitHub's Mac turns this into an Xcode project (xcodegen), builds it, runs it in an
# iPhone simulator (self-test with screenshots) and, with the App Store Connect key in GitHub's secrets, signs it
# and sends it to TestFlight. See .github/workflows/ios.yml.
name: E11Console
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"   # (1.1.0 approved for the App Store 2026-11-07 — TestFlight takes only a higher version now; 1.2.0 = iPhone's own navigation, branch ios-nav)
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  E11Console:
    type: application
    platform: iOS
    # (the scheme with the crawl — Apple's UI testing tapping every control, ios/UITests, .github/workflows/ios-crawl.yml)
    scheme:
      testTargets: [E11ConsoleUITests]
    sources:
      - path: App
      - path: ../widget/WidgetShare.swift
    dependencies:
      - target: E11ConsoleWidget
      - target: E11ConsoleNotify
      - target: E11ConsoleNotifyUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ae.e11.console.ios
        PRODUCT_NAME: E11Console
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/E11Console.entitlements
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: App/E11Console.entitlements
      properties:
        aps-environment: development
        keychain-access-groups: [$(AppIdentifierPrefix)ae.e11.console.shared]   # (shared with the widget: WidgetShare)
        com.apple.developer.associated-domains: [applinks:files.e11hq.com, applinks:files-test.e11hq.com]   # (file links open in the app — flinks.js)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: E11 Console
        # (the Talk button: is E11 Talk on this iPhone — Haris 2026-11-13)
        LSApplicationQueriesSchemes: [e11talk]
        CFBundleName: E11 Console
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIViewControllerBasedStatusBarAppearance: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Lock E11 Console with Face ID, if you turn it on in Me.
        NSCameraUsageDescription: Take a photo or video to attach to a task.
        NSMicrophoneUsageDescription: Record voice messages for comments, and sound with a video you attach to a task.
        NSPhotoLibraryAddUsageDescription: Save pictures and videos you download from E11 Console to Photos.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        E11ServerURL: https://console.e11hq.com
        E11TestServerURL: https://test.e11hq.com
        E11ReviewServerURL: https://review.e11hq.com
        E11KeychainGroup: $(AppIdentifierPrefix)ae.e11.console.shared
        CFBundleURLTypes:
          - CFBundleURLName: ae.e11.console.link
            CFBundleURLSchemes: [e11console]
  # The widget (home and lock screen): widget/E11Widget.swift, the same one the Mac App Store app has
  E11ConsoleWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ae.e11.console.ios.widget
        PRODUCT_NAME: E11ConsoleWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Widget/E11ConsoleWidget.entitlements
        SKIP_INSTALL: YES
    entitlements:
      path: Widget/E11ConsoleWidget.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)ae.e11.console.shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: E11 Console
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        E11KeychainGroup: $(AppIdentifierPrefix)ae.e11.console.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # Confirms each notification to the server, so ones an offline phone missed are sent again (notify/)
  E11ConsoleNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: ../notify
      - path: ../widget/WidgetShare.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ae.e11.console.ios.notify
        PRODUCT_NAME: E11ConsoleNotify
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Notify/E11ConsoleNotify.entitlements
        SKIP_INSTALL: YES
    entitlements:
      path: Notify/E11ConsoleNotify.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)ae.e11.console.shared]
    info:
      path: Notify/Info.plist
      properties:
        CFBundleDisplayName: E11 Console
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        E11KeychainGroup: $(AppIdentifierPrefix)ae.e11.console.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  # A notification held: Apple's expanded view with the app's preview of it, as the Inbox's peek (notifyui/ — Haris 2026-11-10)
  E11ConsoleNotifyUI:
    type: app-extension
    platform: iOS
    sources:
      - path: ../notifyui
      - path: ../widget/WidgetShare.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ae.e11.console.ios.notifyui
        PRODUCT_NAME: E11ConsoleNotifyUI
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: NotifyUI/E11ConsoleNotifyUI.entitlements
        SKIP_INSTALL: YES
    entitlements:
      path: NotifyUI/E11ConsoleNotifyUI.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)ae.e11.console.shared]
    info:
      path: NotifyUI/Info.plist
      properties:
        CFBundleDisplayName: E11 Console
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        E11KeychainGroup: $(AppIdentifierPrefix)ae.e11.console.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: [e11.comment, e11.task]
            UNNotificationExtensionInitialContentSizeRatio: 0.5
            UNNotificationExtensionDefaultContentHidden: true
  # The crawl (Haris 2026-11-05: "every single thing"): Apple's UI testing taps every control on every screen, as each role
  E11ConsoleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: E11Console
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ae.e11.console.ios.uitests
        TEST_TARGET_NAME: E11Console
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
